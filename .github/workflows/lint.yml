name: lint
on:
  push:
  pull_request:
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/lint-fixtures.mjs
      - run: for f in scripts/*.mjs scripts/lib/*.mjs; do node --check "$f"; done
