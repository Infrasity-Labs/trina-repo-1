<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Nina and Maya ask the same AI; each can only open what their own access allows.">
  <style>
    text{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .t{font-size:15px;fill:#1c2b24} .s{font-size:12px;fill:#5b6f64}
    .h{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#16422f}
  </style>
  <rect width="1040" height="440" rx="14" fill="#f4ecd8"/>
  <text x="40" y="44" class="h">ONE SERVER · ONE PERMISSION CHECK · EVERY FILE THE AI OPENS</text>
  <!-- people -->
  <rect x="40" y="80" width="190" height="86" rx="10" fill="#ffffff" stroke="#16422f"/>
  <text x="56" y="110" class="t" font-weight="700">Nina · Sales</text>
  <text x="56" y="132" class="s">"Quote 500 cards + 2 banners"</text>
  <text x="56" y="150" class="s">/quote-from-price-list</text>
  <rect x="40" y="250" width="190" height="86" rx="10" fill="#ffffff" stroke="#16422f"/>
  <text x="56" y="280" class="t" font-weight="700">Maya · Marketing</text>
  <text x="56" y="302" class="s">"What's our margin on cards?"</text>
  <text x="56" y="320" class="s">Check the Finance files</text>
  <!-- server -->
  <rect x="330" y="120" width="250" height="170" rx="12" fill="#16422f"/>
  <text x="355" y="156" font-size="16" font-weight="700" fill="#f4ecd8" style="font-family:Inter,'Segoe UI',Arial,sans-serif">Trina AX server</text>
  <text x="355" y="184" class="s" style="fill:#cfe3d6">1. the asker's access is looked up</text>
  <text x="355" y="206" class="s" style="fill:#cfe3d6">2. every file read is checked</text>
  <text x="355" y="228" class="s" style="fill:#cfe3d6">3. skills load by the same rule</text>
  <text x="355" y="262" class="s" style="fill:#ff9a70;font-weight:700">"no access" looks like "not found"</text>
  <path d="M230 123h100" stroke="#16422f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 293h100" stroke="#16422f" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#16422f"/></marker></defs>
  <!-- files -->
  <g>
    <rect x="680" y="70" width="320" height="40" rx="8" fill="#ffffff" stroke="#2f7d55"/>
    <text x="696" y="95" class="t">shared/pricing/price-list-2026.md</text>
    <rect x="680" y="120" width="320" height="40" rx="8" fill="#ffffff" stroke="#2f7d55"/>
    <text x="696" y="145" class="t">shared/quotes/Q-2026-0044-harbor-dental</text>
    <rect x="680" y="170" width="320" height="40" rx="8" fill="#ffffff" stroke="#2f7d55"/>
    <text x="696" y="195" class="t">groups/Sales/pipeline.md</text>
    <rect x="680" y="250" width="320" height="40" rx="8" fill="#ffe3d6" stroke="#e0532a"/>
    <text x="696" y="275" class="t">groups/Finance/supplier-costs-2026.md</text>
    <rect x="680" y="300" width="320" height="40" rx="8" fill="#ffe3d6" stroke="#e0532a"/>
    <text x="696" y="325" class="t">skills/finance/margin-check</text>
  </g>
  <path d="M580 160L680 100" stroke="#2f7d55" stroke-width="2.5" fill="none"/>
  <path d="M580 175L680 140" stroke="#2f7d55" stroke-width="2.5" fill="none"/>
  <path d="M580 235L680 270" stroke="#e0532a" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <path d="M580 250L680 320" stroke="#e0532a" stroke-width="2.5" stroke-dasharray="6 5" fill="none"/>
  <text x="680" y="372" class="s">Green: Nina's AI can read it.</text><text x="680" y="392" class="s">Orange: closed to Nina and Maya; they cannot see it exists.</text>
</svg>
