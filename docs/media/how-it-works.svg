<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" role="img" aria-label="Nina and Maya ask the same AI; each can only open what their own access allows.">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#f6f2ea" fill-opacity="0.08"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f6f2ea" fill-opacity="0.7"/></marker>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4fbf6a"/></marker>
    <marker id="no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff6a33"/></marker>
  </defs>
  <style>
    text{font-family:Geist,'Segoe UI',ui-sans-serif,system-ui,Helvetica,Arial,sans-serif}
    .m{font-family:'Geist Mono',ui-monospace,Consolas,monospace}
    .t{font-size:15px;fill:#f6f2ea} .s{font-size:12.5px;fill:#b3aaa0}
    .h{font-size:12.5px;font-weight:600;letter-spacing:2px;fill:#ff8a5c}
  </style>
  <rect width="1040" height="440" rx="14" fill="#0e0c0b"/>
  <rect width="1040" height="440" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1039" height="439" rx="13.5" fill="none" stroke="#f6f2ea" stroke-opacity="0.14"/>
  <text x="40" y="44" class="h m">ONE SERVER · ONE PERMISSION CHECK · EVERY FILE THE AI OPENS</text>
  <!-- people -->
  <rect x="40" y="80" width="190" height="86" rx="10" fill="#151210" stroke="#f6f2ea" stroke-opacity="0.22"/>
  <text x="56" y="110" class="t" font-weight="700">Nina · Sales</text>
  <text x="56" y="132" class="s">"Quote 500 cards + 2 banners"</text>
  <text x="56" y="150" class="s m">/quote-from-price-list</text>
  <rect x="40" y="250" width="190" height="86" rx="10" fill="#151210" stroke="#f6f2ea" stroke-opacity="0.22"/>
  <text x="56" y="280" class="t" font-weight="700">Maya · Marketing</text>
  <text x="56" y="302" class="s">"What's our margin on cards?"</text>
  <text x="56" y="320" class="s">Check the Finance files</text>
  <path d="M230 123h100" stroke="#f6f2ea" stroke-opacity="0.7" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 293h100" stroke="#f6f2ea" stroke-opacity="0.7" stroke-width="2" marker-end="url(#a)"/>
  <!-- server -->
  <rect x="330" y="120" width="250" height="170" rx="12" fill="#1a1714" stroke="#ff6a33" stroke-width="1.5"/>
  <rect x="330" y="120" width="250" height="6" rx="3" fill="#ff6a33"/>
  <text x="355" y="156" font-size="16" font-weight="700" class="t">Trina AX server</text>
  <text x="355" y="184" class="s">1. the asker's access is looked up</text>
  <text x="355" y="206" class="s">2. every file read is checked</text>
  <text x="355" y="228" class="s">3. skills load by the same rule</text>
  <text x="355" y="266" class="s" style="fill:#ff8a5c;font-weight:600">"no access" looks like "not found"</text>
  <!-- files -->
  <rect x="680" y="70" width="320" height="40" rx="8" fill="#151210" stroke="#4fbf6a" stroke-opacity="0.7"/>
  <text x="696" y="95" class="t m" style="font-size:13.5px">shared/pricing/price-list-2026.md</text>
  <rect x="680" y="120" width="320" height="40" rx="8" fill="#151210" stroke="#4fbf6a" stroke-opacity="0.7"/>
  <text x="696" y="145" class="t m" style="font-size:13.5px">shared/quotes/Q-2026-0044-harbor-dental</text>
  <rect x="680" y="170" width="320" height="40" rx="8" fill="#151210" stroke="#4fbf6a" stroke-opacity="0.7"/>
  <text x="696" y="195" class="t m" style="font-size:13.5px">groups/Sales/pipeline.md</text>
  <rect x="680" y="250" width="320" height="40" rx="8" fill="#ff6a33" fill-opacity="0.1" stroke="#ff6a33"/>
  <text x="696" y="275" class="t m" style="font-size:13.5px">groups/Finance/supplier-costs-2026.md</text>
  <rect x="680" y="300" width="320" height="40" rx="8" fill="#ff6a33" fill-opacity="0.1" stroke="#ff6a33"/>
  <text x="696" y="325" class="t m" style="font-size:13.5px">skills/finance/margin-check</text>
  <path d="M580 160L676 100" stroke="#4fbf6a" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <path d="M580 175L676 140" stroke="#4fbf6a" stroke-width="2.5" fill="none" marker-end="url(#ok)"/>
  <path d="M580 235L676 270" stroke="#ff6a33" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#no)"/>
  <path d="M580 250L676 320" stroke="#ff6a33" stroke-width="2.5" stroke-dasharray="6 5" fill="none" marker-end="url(#no)"/>
  <circle cx="684" cy="384" r="5" fill="#4fbf6a"/><text x="698" y="389" class="s">Nina's AI can read it.</text>
  <circle cx="684" cy="408" r="5" fill="#ff6a33"/><text x="698" y="413" class="s">Closed to Nina and Maya; they cannot see it exists.</text>
</svg>
