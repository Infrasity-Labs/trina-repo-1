<text x="40" y="80" font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#57524a">Edit the left column to make your own company; the middle column seeds and checks it on a Trina AX server.</text>

