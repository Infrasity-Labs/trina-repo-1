<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-label="Architecture: company.json and company/files feed seed and verify; demo.mjs runs the Docker kit, seed and verify; seed and verify call the Trina AX HTTP API through api.mjs.">
